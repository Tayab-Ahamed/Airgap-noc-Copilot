# /etc/ipsec.conf  (CE1 – strongSwan stub, bind-mounted from configs/ce1/)
# IPSec overlay tunnel: ce1 <-> ce2 over the MPLS underlay.
# In a real deployment the transport addresses are the PE-facing IPs; here we
# use the loopbacks routed via BGP so the tunnel survives PE failover.

config setup
    charondebug = "ike 1, knl 1, cfg 0"
    uniqueids = no

conn %default
    ikelifetime    = 60m
    keylife        = 20m
    rekeymargin    = 3m
    keyingtries    = 1
    keyexchange    = ikev2
    authby         = psk

conn ce1-to-ce2
    left           = 10.0.0.1          # ce1 loopback (routed via BGP/MPLS)
    leftid         = @ce1
    leftsubnet     = 192.168.1.0/24    # branch LAN stub
    right          = 10.0.0.2          # ce2 loopback (DC side)
    rightid        = @ce2
    rightsubnet    = 192.168.2.0/24    # DC LAN stub
    ike            = aes256-sha256-modp2048!
    esp            = aes256-sha256!
    auto           = start
