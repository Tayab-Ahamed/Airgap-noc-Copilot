! ============================================================
! P1 – Provider Core Router
! Role  : OSPF area 0 + LDP label forwarding only.
!         No customer VRF, no BGP.
! Links : eth1 -> PE1 (10.0.23.0/30)   eth2 -> PE2 (10.0.34.0/30)
! Loopback: 10.0.0.21/32
! ============================================================

frr version 8.4.0
frr defaults traditional
hostname p1
log syslog informational
service integrated-vtysh-config

!
interface lo
 ip address 10.0.0.21/32
 ip ospf area 0
!
interface eth1
 description p1->pe1 (MPLS core)
 ip address 10.0.23.2/30
 ip ospf area 0
 mpls enable
!
interface eth2
 description p1->pe2 (MPLS core)
 ip address 10.0.34.1/30
 ip ospf area 0
 mpls enable
!

! ---- OSPF (area 0) ----
router ospf
 ospf router-id 10.0.0.21
 passive-interface default
 no passive-interface eth1
 no passive-interface eth2
 !
 network 10.0.0.21/32 area 0
 network 10.0.23.0/30 area 0
 network 10.0.34.0/30 area 0
!

! ---- LDP ----
mpls ldp
 router-id 10.0.0.21
 !
 address-family ipv4
  discovery transport-address 10.0.0.21
  !
  interface eth1
  !
  interface eth2
  !
 exit-address-family
!

line vty
!
end
