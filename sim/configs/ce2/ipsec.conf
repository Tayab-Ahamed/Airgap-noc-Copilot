# /etc/ipsec.conf  (CE2 – strongSwan stub, bind-mounted from configs/ce2/)
# IPSec overlay tunnel: ce2 <-> ce1 (DC end of the SD-WAN tunnel).

config setup
    charondebug = "ike 1, knl 1, cfg 0"
    uniqueids = no

conn %default
    ikelifetime    = 60m
    keylife        = 20m
    rekeymargin    = 3m
    keyingtries    = 1
    keyexchange    = ikev2
    authby         = psk

conn ce2-to-ce1
    left           = 10.0.0.2          # ce2 loopback (DC side)
    leftid         = @ce2
    leftsubnet     = 192.168.2.0/24    # DC LAN stub
    right          = 10.0.0.1          # ce1 loopback (branch side)
    rightid        = @ce1
    rightsubnet    = 192.168.1.0/24    # branch LAN stub
    ike            = aes256-sha256-modp2048!
    esp            = aes256-sha256!
    auto           = start
