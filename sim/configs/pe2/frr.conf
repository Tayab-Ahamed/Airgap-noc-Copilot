! ============================================================
! PE2 – Provider Edge (Datacenter-side)
! Role  : OSPF+LDP in core, BGP VPNv4 to PE1, eBGP in VRF CUST to CE2
! Links : eth1 -> P1 (10.0.34.0/30)   eth2 -> CE2 (10.0.45.0/30)
! Loopback: 10.0.0.12/32  AS 100
! ============================================================

frr version 8.4.0
frr defaults traditional
hostname pe2
log syslog informational
service integrated-vtysh-config

!
! --- VRF for customer VPN ---
vrf CUST
 vni 100
!

!
interface lo
 ip address 10.0.0.12/32
 ip ospf area 0
!
interface eth1
 description pe2->p1 (MPLS core)
 ip address 10.0.34.2/30
 ip ospf area 0
 mpls enable
!
interface eth2
 description pe2->ce2 (customer-facing, in VRF CUST)
 vrf CUST
 ip address 10.0.45.1/30
!

! ---- OSPF (area 0, core only) ----
router ospf
 ospf router-id 10.0.0.12
 passive-interface default
 no passive-interface eth1
 !
 network 10.0.0.12/32 area 0
 network 10.0.34.0/30 area 0
!

! ---- LDP ----
mpls ldp
 router-id 10.0.0.12
 !
 address-family ipv4
  discovery transport-address 10.0.0.12
  !
  interface eth1
  !
 exit-address-family
!

! ---- iBGP: VPNv4 between PEs ----
router bgp 100
 bgp router-id 10.0.0.12
 bgp log-neighbor-changes
 !
 neighbor 10.0.0.11 remote-as 100
 neighbor 10.0.0.11 description PE1-iBGP
 neighbor 10.0.0.11 update-source lo
 !
 address-family vpnv4
  neighbor 10.0.0.11 activate
  neighbor 10.0.0.11 send-community extended
 exit-address-family
 !
 address-family ipv4 vpn
 exit-address-family
!
router bgp 100 vrf CUST
 bgp router-id 10.0.0.12
 !
 neighbor 10.0.45.2 remote-as 65002
 neighbor 10.0.45.2 description CE2-eBGP
 !
 address-family ipv4 unicast
  neighbor 10.0.45.2 activate
  neighbor 10.0.45.2 soft-reconfiguration inbound
  !
  rd vpn export 100:100
  rt vpn import 100:100
  rt vpn export 100:100
  export vpn
  import vpn
 exit-address-family
!

line vty
!
end
