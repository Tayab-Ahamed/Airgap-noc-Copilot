! ============================================================
! PE1 – Provider Edge (Branch-side)
! Role  : OSPF+LDP in core, BGP VPNv4 to PE2, eBGP in VRF CUST to CE1
! Links : eth1 -> CE1 (10.0.12.0/30)  eth2 -> P1 (10.0.23.0/30)
! Loopback: 10.0.0.11/32  AS 100
! ============================================================

frr version 8.4.0
frr defaults traditional
hostname pe1
log syslog informational
service integrated-vtysh-config

!
! --- VRF for customer VPN ---
vrf CUST
 vni 100
!

!
interface lo
 ip address 10.0.0.11/32
 ip ospf area 0
!
interface eth1
 description pe1->ce1 (customer-facing, in VRF CUST)
 vrf CUST
 ip address 10.0.12.2/30
!
interface eth2
 description pe1->p1 (MPLS core)
 ip address 10.0.23.1/30
 ip ospf area 0
 mpls enable
!

! ---- OSPF (area 0, core only) ----
router ospf
 ospf router-id 10.0.0.11
 passive-interface default
 no passive-interface eth2
 !
 ! Advertise loopback into OSPF so LDP and iBGP sessions use it
 network 10.0.0.11/32 area 0
 network 10.0.23.0/30 area 0
!

! ---- LDP ----
mpls ldp
 router-id 10.0.0.11
 !
 address-family ipv4
  discovery transport-address 10.0.0.11
  !
  interface eth2
  !
 exit-address-family
!

! ---- iBGP: VPNv4 between PEs ----
router bgp 100
 bgp router-id 10.0.0.11
 bgp log-neighbor-changes
 !
 ! iBGP to PE2 via loopbacks (reachable through OSPF+LDP)
 neighbor 10.0.0.12 remote-as 100
 neighbor 10.0.0.12 description PE2-iBGP
 neighbor 10.0.0.12 update-source lo
 !
 address-family vpnv4
  neighbor 10.0.0.12 activate
  neighbor 10.0.0.12 send-community extended
 exit-address-family
 !
 ! ---- VRF CUST: eBGP session to CE1 ----
 address-family ipv4 vpn
 exit-address-family
!
router bgp 100 vrf CUST
 bgp router-id 10.0.0.11
 !
 neighbor 10.0.12.1 remote-as 65001
 neighbor 10.0.12.1 description CE1-eBGP
 !
 address-family ipv4 unicast
  neighbor 10.0.12.1 activate
  neighbor 10.0.12.1 soft-reconfiguration inbound
  !
  ! Import/export the customer VPN with a route-target
  rd vpn export 100:100
  rt vpn import 100:100
  rt vpn export 100:100
  export vpn
  import vpn
 exit-address-family
!

line vty
!
end
