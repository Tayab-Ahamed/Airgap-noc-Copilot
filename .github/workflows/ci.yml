name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint (compile check)
        run: python -m compileall sim ml rag llm agents backend parsers core
      - name: Run tests
        run: pytest -q
      - name: End-to-end (train + index + score)
        run: |
          python -m ml.synthetic_data --minutes 180 --out data/telemetry.parquet
          python -m ml.train --data data/telemetry.parquet --out models/
          python -m rag.indexer --docs rag/runbooks --out data/faiss_index
