# Telegraf config: scrape SNMP + syslog from the sim nodes into a local sink.
# Air-gapped: outputs to a local file/socket only. No cloud outputs.

[agent]
  interval = "10s"
  flush_interval = "10s"
  omit_hostname = false

# --- Inputs ---
[[inputs.snmp]]
  agents = ["udp://pe1:161", "udp://pe2:161", "udp://p1:161"]
  version = 2
  community = "public"
  [[inputs.snmp.field]]
    name = "if_in_octets"
    oid = "IF-MIB::ifHCInOctets"
  [[inputs.snmp.field]]
    name = "if_out_octets"
    oid = "IF-MIB::ifHCOutOctets"

[[inputs.syslog]]
  server = "udp://:6514"

# --- Output: local only (air-gap safe) ---
[[outputs.file]]
  files = ["/var/lib/noc/telemetry.out"]
  data_format = "json"

# Swap the file output for a socket the collector.py tails, or write straight
# to parquet via a small bridge. Never add a cloud output plugin.
